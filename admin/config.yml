                  "label": "备用邮箱",
                  "widget": "string",
                  "required": false
                },
                {
                  "name": "github",
                  "label": "GitHub 个人主页",
                  "widget": "string",
                  "pattern": [
                    "^https://github\\.com/[^\\s]+$",
                    "请填写完整的 GitHub HTTPS 网址"
                  ]
                }
              ]
            },
            {
              "name": "hero",
              "label": "首页简介",
              "widget": "object",
              "fields": [
                {
                  "name": "eyebrow",
                  "label": "上方标签",
                  "widget": "string"
                },
                {
                  "name": "title",
                  "label": "首页标题",
                  "widget": "text"
                },
                {
                  "name": "description",
                  "label": "个人简介",
                  "widget": "text"
                },
                {
                  "name": "primary_label",
                  "label": "论文按钮文字",
                  "widget": "string"
                },
                {
                  "name": "contact_label",
                  "label": "联系按钮文字",
                  "widget": "string"
                }
              ]
            },
            {
              "name": "research",
              "label": "研究方向",
              "widget": "list",
              "summary": "{{fields.title}}",
              "fields": [
                {
                  "name": "title",
                  "label": "方向名称",
                  "widget": "string"
                },
                {
                  "name": "description",
                  "label": "介绍",
                  "widget": "text"
                }
              ]
            },
            {
              "name": "publications",
              "label": "论文与海报（可拖动排序）",
              "widget": "list",
              "summary": "{{fields.title}}",
              "fields": [
                {
                  "name": "year",
                  "label": "年份",
                  "widget": "string"
                },
                {
                  "name": "title",
                  "label": "论文标题",
                  "widget": "text"
                },
                {
                  "name": "authors",
                  "label": "作者（按原顺序）",
                  "widget": "text",
                  "required": false
                },
                {
                  "name": "venue",
                  "label": "期刊 / 会议",
                  "widget": "string"
                },
                {
                  "name": "details",
