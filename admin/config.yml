                },
                {
                  "name": "chinese_name",
                  "label": "中文姓名",
                  "widget": "string"
                },
                {
                  "name": "label",
                  "label": "身份标签",
                  "widget": "string"
                },
                {
                  "name": "role",
                  "label": "职位 / 学位",
                  "widget": "string"
                },
                {
                  "name": "department",
