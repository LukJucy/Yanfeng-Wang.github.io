                  "widget": "text",
                  "required": false
                },
                {
                  "name": "url",
                  "label": "DOI / 论文链接",
                  "widget": "string",
                  "required": false,
                  "pattern": [
                    "^https?://[^\\s]+$",
                    "请填写 http:// 或 https:// 开头的完整网址"
                  ]
                },
                {
                  "name": "corresponding",
                  "label": "通讯作者",
                  "widget": "boolean",
                  "default": false,
                  "required": false
                }
              ]
            },
            {
              "name": "experience",
