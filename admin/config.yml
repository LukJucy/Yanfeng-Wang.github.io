              "widget": "list",
              "summary": "{{fields.title}}",
              "fields": [
                {
                  "name": "title",
                  "label": "名称",
                  "widget": "string"
                },
                {
                  "name": "details",
                  "label": "年份 / 补充信息",
                  "widget": "string"
                }
              ]
            }
          ]
        }
      ]
    }
  ]
